name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are filed hours after the incident they describe, so a green
    # tree yesterday says nothing about today.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories bans

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # xkbcommon and wayland-sys probe these with pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo test --locked
